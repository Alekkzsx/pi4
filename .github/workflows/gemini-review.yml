name: Gemini AI Code Reviewer

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai PyGithub

      - name: Run Gemini Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import sys
          from github import Github
          import google.generativeai as genai

          gemini_key = os.environ.get("GEMINI_API_KEY")
          gh_token = os.environ.get("GITHUB_TOKEN")
          pr_number = int(os.environ.get("PR_NUMBER"))
          repo_name = os.environ.get("REPO_NAME")

          if not gemini_key:
              print("ERRO: A secret GEMINI_API_KEY não foi encontrada!")
              sys.exit(1)

          genai.configure(api_key=gemini_key)

          # Busca os modelos ativos suportados para a API Key
          available_models = [
              m.name for m in genai.list_models() 
              if 'generateContent' in m.supported_generation_methods
          ]
          print("Modelos disponíveis:", available_models)

          if not available_models:
              print("Nenhum modelo de geração de conteúdo disponível!")
              sys.exit(1)

          # Seleciona o modelo Flash disponível ou o primeiro modelo válido
          selected_model_name = next(
              (m for m in available_models if 'flash' in m.lower()), 
              available_models[0]
          )
          print(f"Modelo selecionado: {selected_model_name}")

          model = genai.GenerativeModel(selected_model_name)

          gh = Github(gh_token)
          repo = gh.get_repo(repo_name)
          pr = repo.get_pull(pr_number)

          # Coleta mensagens de commit e arquivos alterados
          commits = [commit.commit.message for commit in pr.get_commits()]
          files = pr.get_files()
          
          diff_text = ""
          for f in files:
              diff_text += f"\nArquivo: {f.filename} ({f.status})\nPatch:\n{f.patch or 'Sem alteração de código'}\n"

          commits_str = "\n".join(f"- {c.strip()}" for c in commits)

          prompt = f"""
          Você é um Revisor de Código Sênior focado em qualidade e boas práticas. Analise o seguinte Pull Request:

          Título do PR: {pr.title}

          Mensagens dos Commits:
          {commits_str}

          Diff de Código Alterado:
          {diff_text[:15000]}

          Responda OBRIGATORIAMENTE em Português do Brasil (pt-BR) no seguinte formato Markdown estrito:

          ## 🤖 Análise do Gemini AI - Code Review

          ### 📝 Validação de Commits e Padrão (Conventional Commits)
          - Verifique se as mensagens de commit listadas acima seguem o padrão Conventional Commits (ex: `feat:`, `fix:`, `docs:`, `refactor:`, `test:`, `chore:`).
          - Se houver algum commit fora do padrão, mencione claramente e dê o comando exato para sugestão de ajuste no terminal.

          ### 🎯 Resumo das Alterações
          - Resumo simples de 2 a 3 frases explicativas sobre o que este PR altera.

          ### ⚠️ Pontos de Atenção & Erros
          - Identifique possíveis bugs, faltas de tratamento de exceções (ex: divisão por zero), problemas de validação ou segurança.

          ### 💡 Sugestões de Melhoria (com 1 clique)
          - Forneça blocos de sugestão ```suggestion com o código corrigido caso haja melhorias recomendadas.
          """

          response = model.generate_content(prompt)
          comment_body = response.text

          pr.create_issue_comment(comment_body)
          print("Comentário de revisão do Gemini publicado com sucesso no PR!")
          EOF
