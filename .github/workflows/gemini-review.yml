name: Gemini AI Code Reviewer

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisor IA do Gemini
        uses: truongnh1992/gemini-ai-code-reviewer@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash"
          CUSTOM_PROMPT: |
            Você é um Revisor de Código Sênior focado em qualidade, segurança e padronização.
            Responda SEMPRE em Português do Brasil (pt-BR).

            Por favor, estruture sua análise no seguinte padrão exato:

            ## 🤖 Análise do Gemini AI - Code Review

            ### 📝 Validação de Commits e Padrão
            - Verifique se os commits e título do PR seguem o padrão **Conventional Commits** (ex: `feat:`, `fix:`, `docs:`, `refactor:`, `test:`, `chore:`).
            - Caso esteja fora do padrão, indique claramente o commit e sugira a mensagem correta.

            ### 🎯 Resumo das Alterações
            - Breve explicação do que o código altera ou adiciona.

            ### ⚠️ Pontos de Atenção & Erros
            - Bugs potenciais, falhas de segurança ou problemas de desempenho.

            ### 💡 Sugestões de Melhoria (com 1 clique)
            - Utilize blocos de sugestão interativos do GitHub (```suggestion) onde aplicável para facilitar a aplicação da correção.
